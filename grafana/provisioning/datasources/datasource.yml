apiVersion: 1
datasources:
  - name: WebLogs Postgres
    uid: weblogs-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: weblogs
    isDefault: true
    jsonData:
      database: weblogs
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: weblogs_pw
